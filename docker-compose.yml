services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: workspace_hub
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspace -d workspace_hub"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
